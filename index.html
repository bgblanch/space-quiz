<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <title>Cosmic Quiz — How well do you know space?</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --bg: #f4f4fb;
      --card: #fff;
      --ink: #20233b;
      --muted: #777b96;
      --line: #e8e8f1;
      --accent: #7357e8;
      --accent-soft: #f0edff;
      --green: #18895b;
      --green-bg: #e9f8f0;
      --red: #c94356;
      --red-bg: #fff0f1;
      --shadow: 0 22px 70px rgb(34 28 79 / 10%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101426;
        --card: #191e34;
        --ink: #f3f2ff;
        --muted: #a5a8c0;
        --line: #30354e;
        --accent: #a18bff;
        --accent-soft: #292343;
        --green: #72e0ac;
        --green-bg: #183a32;
        --red: #ff8a99;
        --red-bg: #43252f;
        --shadow: 0 22px 70px rgb(0 0 0 / 28%);
      }
    }

    * { box-sizing: border-box; }

    body::before {
      position: fixed;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 8% 18%, color-mix(in srgb, var(--ink), transparent 46%) 50%, transparent 100%),
        radial-gradient(1px 1px at 22% 74%, color-mix(in srgb, var(--accent), transparent 40%) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 37% 38%, color-mix(in srgb, var(--ink), transparent 54%) 50%, transparent 100%),
        radial-gradient(1px 1px at 53% 88%, color-mix(in srgb, var(--accent), transparent 44%) 50%, transparent 100%),
        radial-gradient(1px 1px at 68% 23%, color-mix(in srgb, var(--ink), transparent 48%) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 82% 62%, color-mix(in srgb, var(--accent), transparent 48%) 50%, transparent 100%),
        radial-gradient(1px 1px at 94% 9%, color-mix(in srgb, var(--ink), transparent 44%) 50%, transparent 100%);
      content: "";
      animation: star-twinkle 7s ease-in-out infinite alternate;
    }

    .quiz-shell {
      position: relative;
      z-index: 1;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 10%, rgb(132 103 255 / 12%), transparent 34rem),
        radial-gradient(ellipse at 92% 86%, rgb(66 196 201 / 10%), transparent 30rem),
        var(--bg);
      font-size: 15px;
      line-height: 1.5;
    }

    button { font: inherit; }
    [hidden] { display: none !important; }

    .quiz-shell { width: min(100%, 520px); }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--accent);
      font-size: 16px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--accent), var(--line) 76%);
      border-radius: 19px;
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--accent), transparent 95%) 1px, transparent 1px),
        linear-gradient(color-mix(in srgb, var(--accent), transparent 95%) 1px, transparent 1px),
        var(--card);
      background-size: 28px 28px;
      box-shadow: var(--shadow);
    }

    .card::before {
      position: absolute;
      z-index: 1;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), #53c8c3 72%, transparent);
      content: "";
    }

    .card-inner, .result { position: relative; }

    .card-inner { padding: clamp(24px, 6vw, 38px); }

    .mission-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .mission-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--green);
    }

    .mission-status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 10px color-mix(in srgb, currentColor, transparent 35%);
      content: "";
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: color-mix(in srgb, var(--card), var(--bg) 38%);
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      margin-bottom: 30px;
      border-radius: 3px;
      background: var(--line);
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8c6df5, #53c8c3);
      transition: width 420ms cubic-bezier(.2,.8,.2,1);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 24px;
      font-size: clamp(22px, 5vw, 28px);
      letter-spacing: -.035em;
      line-height: 1.25;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      position: relative;
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .answer:focus-visible,
    .primary:focus-visible,
    h1:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent), transparent 84%);
    }

    .answer:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .answer:disabled { cursor: default; }

    .letter {
      display: grid;
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .answer.correct {
      border-color: color-mix(in srgb, var(--green), transparent 40%);
      background: var(--green-bg);
      color: var(--green);
      animation: pop-in 320ms ease both;
    }

    .answer.correct .letter {
      border-color: transparent;
      background: var(--green);
      color: #fff;
    }

    .answer.wrong {
      border-color: color-mix(in srgb, var(--red), transparent 40%);
      background: var(--red-bg);
      color: var(--red);
      animation: shake 380ms ease both;
    }

    .answer.wrong .letter {
      border-color: transparent;
      background: var(--red);
      color: #fff;
    }

    .feedback {
      min-height: 25px;
      margin: 16px 0 0;
      font-size: 14px;
      font-weight: 650;
    }
    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }

    .footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .primary {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 19px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 18px color-mix(in srgb, var(--accent), transparent 78%);
      transition: transform 150ms ease, filter 150ms ease;
    }

    .primary:hover { transform: translateY(-1px); filter: brightness(1.07); }
    .primary:active { transform: translateY(0); }

    .result {
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 18%, color-mix(in srgb, var(--accent), transparent 91%), transparent 56%);
      padding: 48px 34px;
      text-align: center;
    }

    .result.celebration {
      background:
        radial-gradient(ellipse at 50% 28%, color-mix(in srgb, #f4c95d, transparent 83%), transparent 48%),
        radial-gradient(ellipse at 50% 18%, color-mix(in srgb, var(--accent), transparent 91%), transparent 56%);
    }

    .confetti {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti i {
      position: absolute;
      top: -12px;
      left: var(--x);
      width: 7px;
      height: 12px;
      border-radius: 2px;
      background: var(--confetti-color);
      opacity: 0;
      transform: rotate(var(--rotation));
      animation: confetti-fall 1.8s ease-out var(--delay) both;
    }

    .confetti i:nth-child(1) { --x: 9%; --rotation: 28deg; --delay: 40ms; --confetti-color: var(--accent); }
    .confetti i:nth-child(2) { --x: 19%; --rotation: -35deg; --delay: 180ms; --confetti-color: #f4c95d; }
    .confetti i:nth-child(3) { --x: 31%; --rotation: 64deg; --delay: 90ms; --confetti-color: #53c8c3; }
    .confetti i:nth-child(4) { --x: 43%; --rotation: -18deg; --delay: 280ms; --confetti-color: var(--green); }
    .confetti i:nth-child(5) { --x: 57%; --rotation: 42deg; --delay: 130ms; --confetti-color: #f4c95d; }
    .confetti i:nth-child(6) { --x: 69%; --rotation: -58deg; --delay: 240ms; --confetti-color: var(--accent); }
    .confetti i:nth-child(7) { --x: 81%; --rotation: 15deg; --delay: 60ms; --confetti-color: #53c8c3; }
    .confetti i:nth-child(8) { --x: 92%; --rotation: -28deg; --delay: 200ms; --confetti-color: var(--green); }

    .result-honor {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: -12px 0 18px;
      padding: 5px 10px;
      border: 1px solid color-mix(in srgb, #c89519, var(--line) 45%);
      border-radius: 999px;
      background: color-mix(in srgb, #f4c95d, transparent 86%);
      color: color-mix(in srgb, #a36b00, var(--ink) 18%);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    @media (prefers-color-scheme: dark) {
      .result-honor { color: #f4d77b; }
    }

    .celebration .reaction {
      border-color: color-mix(in srgb, #f4c95d, var(--line) 50%);
      background: color-mix(in srgb, #f4c95d, var(--accent-soft) 58%);
      animation: float-in 600ms cubic-bezier(.16,1,.3,1) both, honor-glow 1.8s ease-in-out 600ms 2;
    }

    .result .mission-bar {
      margin: -10px 0 30px;
      text-align: left;
    }

    .reaction {
      display: grid;
      width: 88px;
      height: 88px;
      place-items: center;
      margin: 0 auto 22px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--accent-soft);
      font-size: 46px;
      animation: float-in 600ms cubic-bezier(.16,1,.3,1) both;
    }

    .result h1 { margin-bottom: 8px; }
    .result-copy { margin: 0 auto 24px; color: var(--muted); }
    .result-score { margin-bottom: 27px; font-size: 15px; }
    .result-score strong { color: var(--accent); font-size: 22px; }
    .result .primary { width: 100%; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    @keyframes shake {
      15%, 65% { transform: translateX(-5px); }
      35%, 85% { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }

    @keyframes pop-in {
      0% { transform: scale(.98); }
      60% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    @keyframes float-in {
      from { opacity: 0; transform: translateY(12px) scale(.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes star-twinkle {
      from { opacity: .48; }
      to { opacity: .9; }
    }

    @keyframes confetti-fall {
      0% { opacity: 0; transform: translateY(-4px) rotate(var(--rotation)); }
      12% { opacity: .85; }
      100% { opacity: 0; transform: translateY(160px) rotate(calc(var(--rotation) + 100deg)); }
    }

    @keyframes honor-glow {
      50% { box-shadow: 0 0 28px color-mix(in srgb, #f4c95d, transparent 50%); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="quiz-shell" aria-label="Cosmic space quiz">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Cosmic quiz</div>
    <section class="card" id="quiz-card" aria-live="polite">
      <div class="card-inner">
        <div class="mission-bar" aria-label="Mission status">
          <span>Flight log · CX-10</span>
          <span class="mission-status">Systems nominal</span>
        </div>
        <div class="topline">
          <span id="question-count">Question 1 of 10</span>
          <span class="score-pill" aria-label="Score"><span aria-hidden="true">✧</span> <span id="score">0</span> pts</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="eyebrow">A little trip through the universe</p>
        <h1 id="question" tabindex="-1">Loading question…</h1>
        <div class="answers" id="answers"></div>
        <p class="feedback" id="feedback" aria-live="assertive"></p>
        <div class="footer"><button class="primary" id="next-button" type="button" hidden>Next question <span aria-hidden="true">→</span></button></div>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "Which planet is known as the Red Planet?",
        options: ["Venus", "Mars", "Mercury", "Jupiter"],
        answer: 1,
        fact: "Mars gets its rusty-red color from iron-rich dust."
      },
      {
        question: "What is the name of the galaxy we call home?",
        options: ["Andromeda", "Whirlpool Galaxy", "Milky Way", "Sombrero Galaxy"],
        answer: 2,
        fact: "Our solar system sits in one of the Milky Way's spiral arms."
      },
      {
        question: "Which planet has the most prominent ring system?",
        options: ["Saturn", "Neptune", "Earth", "Uranus"],
        answer: 0,
        fact: "Saturn's rings are made mostly of countless pieces of ice and rock."
      },
      {
        question: "What is the closest star to Earth?",
        options: ["Sirius", "Proxima Centauri", "The Sun", "Polaris"],
        answer: 2,
        fact: "The Sun is about 150 million kilometers from Earth."
      },
      {
        question: "Which force keeps planets in orbit around the Sun?",
        options: ["Magnetism", "Gravity", "Friction", "Solar wind"],
        answer: 1,
        fact: "The Sun's gravity holds the solar system together."
      },
      {
        question: "What is the largest planet in our solar system?",
        options: ["Neptune", "Saturn", "Earth", "Jupiter"],
        answer: 3,
        fact: "Jupiter is so large that more than 1,300 Earths could fit inside it."
      },
      {
        question: "Which celestial body is famous for its Great Red Spot?",
        options: ["Mars", "Jupiter", "Saturn", "The Moon"],
        answer: 1,
        fact: "The Great Red Spot is a giant storm that has raged for centuries."
      },
      {
        question: "What is the name of the first human to walk on the Moon?",
        options: ["Yuri Gagarin", "Buzz Aldrin", "Neil Armstrong", "John Glenn"],
        answer: 2,
        fact: "Neil Armstrong took his historic first steps in 1969."
      },
      {
        question: "About how long does sunlight take to reach Earth?",
        options: ["8 minutes", "8 seconds", "1 hour", "24 minutes"],
        answer: 0,
        fact: "Sunlight travels 150 million kilometers in about 8 minutes and 20 seconds."
      },
      {
        question: "Which planet is tilted so much it appears to spin on its side?",
        options: ["Mercury", "Uranus", "Mars", "Venus"],
        answer: 1,
        fact: "Uranus has an extreme axial tilt of about 98 degrees."
      }
    ];

    let current = 0;
    let score = 0;
    let answered = false;

    let questionEl = document.querySelector("#question");
    let answersEl = document.querySelector("#answers");
    let feedbackEl = document.querySelector("#feedback");
    let nextButton = document.querySelector("#next-button");
    let countEl = document.querySelector("#question-count");
    let scoreEl = document.querySelector("#score");
    let fillEl = document.querySelector("#progress-fill");
    let progressEl = document.querySelector(".progress-track");

    function renderQuestion() {
      const item = questions[current];
      answered = false;
      countEl.textContent = `Question ${current + 1} of ${questions.length}`;
      scoreEl.textContent = score;
      fillEl.style.width = `${((current + 1) / questions.length) * 100}%`;
      progressEl.setAttribute("aria-valuenow", current + 1);
      questionEl.textContent = item.question;
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      nextButton.hidden = true;
      answersEl.replaceChildren();

      item.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.innerHTML = `<span class="letter">${String.fromCharCode(65 + index)}</span><span>${option}</span>`;
        button.addEventListener("click", () => chooseAnswer(index));
        button.addEventListener("keydown", event => {
          const buttons = [...answersEl.querySelectorAll(".answer")];
          const currentIndex = buttons.indexOf(button);
          if (event.key === "ArrowDown" || event.key === "ArrowRight") {
            event.preventDefault();
            buttons[(currentIndex + 1) % buttons.length].focus();
          } else if (event.key === "ArrowUp" || event.key === "ArrowLeft") {
            event.preventDefault();
            buttons[(currentIndex - 1 + buttons.length) % buttons.length].focus();
          }
        });
        activateOnKeyboard(button, () => chooseAnswer(index));
        answersEl.append(button);
      });
    }

    function activateOnKeyboard(button, action) {
      button.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          action();
        }
      });
    }

    function chooseAnswer(selected) {
      if (answered) return;
      answered = true;
      const item = questions[current];
      const buttons = [...answersEl.querySelectorAll(".answer")];
      buttons.forEach(button => { button.disabled = true; });

      if (selected === item.answer) {
        score += 1;
        buttons[selected].classList.add("correct");
        feedbackEl.textContent = `✨ Correct! ${item.fact}`;
        feedbackEl.classList.add("good");
      } else {
        buttons[selected].classList.add("wrong");
        buttons[item.answer].classList.add("correct");
        feedbackEl.textContent = `Not quite — ${item.fact}`;
        feedbackEl.classList.add("bad");
      }
      scoreEl.textContent = score;
      nextButton.hidden = false;
      nextButton.innerHTML = current === questions.length - 1
        ? 'See my results <span aria-hidden="true">→</span>'
        : 'Next question <span aria-hidden="true">→</span>';
      nextButton.focus();
    }

    function showResults() {
      const percent = score / questions.length;
      const highScore = score >= 8;
      const reaction = percent === 1 ? "🚀" : percent >= .7 ? "🌟" : percent >= .4 ? "🪐" : "🌱";
      const headline = percent === 1 ? "Out of this world!" : percent >= .7 ? "Stellar work!" : percent >= .4 ? "Nice exploring!" : "Keep reaching for the stars!";
      const copy = percent === 1
        ? "A perfect flight through the cosmos. You're a space superstar!"
        : percent >= .7
          ? "You know your way around the universe. Keep that curiosity glowing."
          : percent >= .4
            ? "Every great astronaut starts somewhere. Your next adventure is waiting."
            : "The universe is full of wonders. Take another trip and see what you discover.";

      document.querySelector("#quiz-card").innerHTML = `
        <div class="result${highScore ? " celebration" : ""}">
          ${highScore ? '<div class="confetti" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>' : ""}
          <div class="mission-bar" aria-label="Mission status">
            <span>Flight log · CX-10</span>
            <span class="mission-status">Report received</span>
          </div>
          <div class="reaction" aria-hidden="true">${reaction}</div>
          ${highScore ? '<p class="result-honor"><span aria-hidden="true">✦</span> Flight honors</p>' : ""}
          <p class="eyebrow">${highScore ? "Mission success" : "Mission complete"}</p>
          <h1>${headline}</h1>
          <p class="result-copy">${copy}</p>
          <p class="result-score">You scored <strong>${score} / ${questions.length}</strong></p>
          <button class="primary" id="restart-button" type="button">Explore again <span aria-hidden="true">↻</span></button>
        </div>`;
      document.querySelector("#restart-button").addEventListener("click", restart);
      activateOnKeyboard(document.querySelector("#restart-button"), restart);
      document.querySelector("#restart-button").focus();
    }

    function restart() {
      current = 0;
      score = 0;
      document.querySelector("#quiz-card").innerHTML = `
        <div class="card-inner">
          <div class="mission-bar" aria-label="Mission status">
            <span>Flight log · CX-10</span>
            <span class="mission-status">Systems nominal</span>
          </div>
          <div class="topline">
            <span id="question-count">Question 1 of 10</span>
            <span class="score-pill" aria-label="Score"><span aria-hidden="true">✧</span> <span id="score">0</span> pts</span>
          </div>
          <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <p class="eyebrow">A little trip through the universe</p>
          <h1 id="question" tabindex="-1">Loading question…</h1>
          <div class="answers" id="answers"></div>
          <p class="feedback" id="feedback" aria-live="assertive"></p>
          <div class="footer"><button class="primary" id="next-button" type="button" hidden>Next question <span aria-hidden="true">→</span></button></div>
        </div>`;
      bindElements();
      renderQuestion();
    }

    function bindElements() {
      questionEl = document.querySelector("#question");
      answersEl = document.querySelector("#answers");
      feedbackEl = document.querySelector("#feedback");
      nextButton = document.querySelector("#next-button");
      countEl = document.querySelector("#question-count");
      scoreEl = document.querySelector("#score");
      fillEl = document.querySelector("#progress-fill");
      progressEl = document.querySelector(".progress-track");
      nextButton.addEventListener("click", advanceQuestion);
      activateOnKeyboard(nextButton, advanceQuestion);
    }

    function advanceQuestion() {
      current += 1;
      if (current === questions.length) showResults();
      else {
        renderQuestion();
        questionEl.focus();
      }
    }

    nextButton.addEventListener("click", advanceQuestion);
    activateOnKeyboard(nextButton, advanceQuestion);

    renderQuestion();
  </script>
</body>
</html>
